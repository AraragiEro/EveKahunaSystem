name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================================
  # 后端测试
  # ============================================================
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Create test config
        run: |
          cat > config.toml << 'EOF'
          [APP]
          SECRET_KEY = "ci-test-secret-key-for-jwt"
          ENABLE_API_DOCS = false

          [POSTGREDB]
          Host = "localhost"
          Port = 5432
          Database = "test_db"
          User = "test"
          Password = "test"

          [REDIS]
          Host = "localhost"
          Port = 6379

          [NEO4J]
          Host = "localhost"
          Port = 7687
          Username = "neo4j"
          Password = "test"

          [EVE]
          CLIENT_ID = "test"
          SECRET_KEY = "test"
          CALLBACK_LOCAL_HOST = "localhost:9527"

          [SDEDB]
          Host = "localhost"
          Port = 5432
          Database = "sde_test"
          User = "test"
          Password = "test"

          [EDITION]
          Edition = "community"
          EOF

      - name: Install dependencies
        run: uv sync --group test

      - name: Run lint (ruff)
        run: uv run ruff check src_v2/ tests/ --select=E,F,W --ignore=E501

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Run DAO tests
        run: uv run pytest tests/dao/ -v --tb=short

      - name: Run API tests
        run: uv run pytest tests/api/ -v --tb=short

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --tb=short

      - name: Run all tests with coverage
        run: |
          uv run pytest tests/ \
            --ignore=tests/test_connect_manager.py \
            --cov=src_v2 \
            --cov-report=xml \
            --cov-report=term \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
        continue-on-error: true

  # ============================================================
  # 前端测试
  # ============================================================
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: src_v2/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src_v2/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit
        continue-on-error: true

      - name: Run tests
        run: npx vitest run --coverage

  # ============================================================
  # 集成测试 (含 PostgreSQL + Redis 服务容器)
  # ============================================================
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kahuna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --group test

      - name: Run integration tests with real DB
        env:
          POSTGRES_TEST_ENABLED: 1
          REDIS_TEST_ENABLED: 1
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: kahuna_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: uv run pytest tests/ -m "integration" -v --tb=short
        continue-on-error: true
