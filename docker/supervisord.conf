; ============================================
; Supervisord 配置文件
; 同时管理 KahunaBot 后端和 MCP 中间件
; ============================================

[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid

; --------------------------------------------
; KahunaBot Web 服务
; --------------------------------------------
[program:kahunabot]
command=/root/.local/bin/uv run python run_server.py --prod --host 0.0.0.0 --port 9527
directory=/app
autostart=true
autorestart=true
startretries=3
; 同时输出到日志文件和 stdout，方便调试
stdout_logfile=/app/logs/kahunabot.log
stderr_logfile=/app/logs/kahunabot.error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
redirect_stderr=false
environment=PYTHONUNBUFFERED="1"

; --------------------------------------------
; MCP 中间件服务
; --------------------------------------------
[program:mcp-middleware]
command=/root/.local/bin/uv run python run_mcp_middleware.py --host 0.0.0.0 --port 9274 --quart-url http://localhost:9527
directory=/app
autostart=true
autorestart=true
startretries=3
; 同时输出到日志文件和 stdout，方便调试
stdout_logfile=/app/logs/mcp.log
stderr_logfile=/app/logs/mcp.error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
redirect_stderr=false
environment=PYTHONUNBUFFERED="1"

; MCP 服务依赖于 KahunaBot，延迟启动确保主服务先就绪
startsecs=15
