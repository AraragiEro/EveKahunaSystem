[project]
name = "astrbot-plugin-kahunabot"
version = "1.6.1"
description = "EVE Online 工业规划与资产管理系统"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.13.2",
    "asyncpg>=0.30.0",
    "cachetools>=6.2.2",
    "colorlog>=6.10.1",
    "httpx>=0.28.1",
    "httplib2[socks]>=0.22.0",
    "imgkit>=1.2.3",
    "jinja2>=3.1.6",
    "neo4j>=6.0.3",
    "networkx>=3.5",
    "oauthlib>=3.3.1",
    "peewee>=3.18.3",
    "pypinyin>=0.51.0",
    "pydantic>=2.12.4",
    "pyjwt>=2.10.1",
    "pyppeteer>=2.0.0",
    "quart>=0.20.0",
    "redis>=7.0.1",
    "requests>=2.32.5",
    "requests-oauthlib>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "thefuzz>=0.22.1",
    "tqdm>=4.67.1",
    "tomli-w>=1.0.0",
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "watchfiles>=1.1.1",
    "werkzeug>=3.1.3",
    "aiocache>=0.12.3",
    "numpy>=2.3.5",
    "ortools>=9.14.6206",
    "cryptography>=46.0.3",
    "quart-schema>=0.23.0",
    "google-api-python-client>=2.167.0",
    "google-auth>=2.40.3",
    "google-auth-httplib2>=0.2.0",
    "pysocks>=1.7.1",
    "mcp>=1.12.0,<2.0.0",
    "alembic>=1.18.4",
]

[dependency-groups]
test = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: 单元测试，无外部依赖",
    "dao: DAO 层测试，需要 SQLite 内存数据库",
    "api: API 路由测试，需要 Quart 测试客户端",
    "integration: 完整集成测试，需要 Docker 容器",
    "slow: 耗时测试",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[[tool.uv.index]]
url="http://mirrors.aliyun.com/pypi/simple/"
default=true
